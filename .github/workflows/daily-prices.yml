name: 每日实时菜价更新

# 触发：每天 01:30 UTC = 北京时间 09:30 自动运行；也可在 Actions 页手动 Run workflow
on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch: {}

# contents:write 提交新价格；pages:write + id-token:write 用于部署 Pages
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

environment:
  name: github-pages
  url: ${{ steps.deploy.outputs.page_url }}

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖（含 Playwright 浏览器引擎）
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: 抓取新发地当日行情并重生成数据
        run: |
          python fetch_live_prices.py
          python update_prices.py --live

      - name: 提交数据变化（仅当有变化）
        run: |
          git config user.name "price-bot"
          git config user.email "bot@machang.local"
          git add assets/data/data.js assets/data/live_market.json
          if git diff --cached --quiet; then
            echo "无价格变化，跳过提交"
          else
            git commit -m "chore: 实时菜价更新 $(date +%Y-%m-%d)"
            git push
          fi

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: 部署到 GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
